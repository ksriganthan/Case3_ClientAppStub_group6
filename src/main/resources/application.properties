# ============================================================
# FILTERUNG ? Es gibt zwei Möglichkeiten, Aufträge zu filtern:
#
# VARIANTE 1: Content-Based Router (Broker-seitig)
#   -> Ein regionsspezifisches oder typspezifisches Topic abonnieren.
#   -> Den entsprechenden client-seitigen Filter LEER lassen,
#      da die Filterung bereits durch die Topic-Wahl erfolgt.
#   -> Der jeweils andere Filter kann weiterhin gesetzt werden!
#      z.B. Topic "...new.basel" + client.jobType=repair -> nur Basel-Reparaturen
#
# VARIANTE 2: Client-seitiger Filter
#   -> Das allgemeine Topic (group6.dispo.jobs.new) abonnieren.
#   -> client.region und/oder client.jobType setzen.
#
# ACHTUNG: Nicht den gleichen Filter doppelt widersprüchlich setzen!
#   z.B. Topic "...new.basel" + client.region=zuerich -> es kommt NICHTS an.
# ============================================================

# --- VARIANTE 1: Content-Based Router (Topic-Wahl) ---
# Alle Aufträge:          group6.dispo.jobs.new
# Nur Basel:              group6.dispo.jobs.new.basel
# Nur Zuerich:            group6.dispo.jobs.new.zuerich
# Nur Bern:               group6.dispo.jobs.new.bern
# Nur Reparatur:          group6.dispo.jobs.new.repair
# Nur Wartung:            group6.dispo.jobs.new.maintenance
channel.topic.newJobs=group6.dispo.jobs.new

# --- VARIANTE 2: Client-seitiger Filter (nur bei allgemeinem Topic sinnvoll) ---
# Region-Filter: basel, zuerich, bern (Komma-getrennt möglich, leer = alle)
client.region=
# JobType-Filter: repair, maintenance (leer = alle)
client.jobType=

